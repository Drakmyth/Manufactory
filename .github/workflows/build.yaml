name: GitHub CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  datagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25', cache: gradle}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew runData --no-daemon
      - run: test -d src/generated/resources/data/manufactory && test -d src/generated/resources/assets/manufactory
      - uses: actions/upload-artifact@v4
        with: {name: generated-resources, path: src/generated/resources}
  build:
    needs: datagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25', cache: gradle}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with: {name: generated-resources, path: src/generated/resources}
      - run: ./gradlew build --no-daemon
      - run: unzip -l build/libs/manufactory-*.jar | grep -q 'data/manufactory/'
