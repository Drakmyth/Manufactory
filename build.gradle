plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources').absolutePath, '--existing',
                    file('src/main/resources').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_homepage           : mod_homepage,
            mod_issues             : mod_issues,
            mod_update_json        : mod_update_json
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('mcmodsrepo')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Minecraft 26.1 replaced the legacy model provider pipeline. Keep only that
// isolated while recipes, tags, loot, and language migrate on the normal classpath.
tasks.named('compileJava', JavaCompile).configure {
    exclude 'com/drakmyth/minecraft/manufactory/datagen/ModBlockStateProvider.java'
    exclude 'com/drakmyth/minecraft/manufactory/datagen/ModItemProvider.java'
    exclude 'com/drakmyth/minecraft/manufactory/datagen/AnimatedTextureProvider.java'
    exclude 'com/drakmyth/minecraft/manufactory/datagen/ModAnimatedTextureProvider.java'
    exclude 'com/drakmyth/minecraft/manufactory/datagen/ModLootTableProvider.java'
    exclude 'com/drakmyth/minecraft/manufactory/datagen/ModTagsProvider.java'
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}
